<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сайт-визитка</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== Общие SVG-заготовки: лист и крест ===== -->
<svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <!-- Лист: растёт из точки (0,0) вправо по оси X.
         Цвет и толщину контура задаёт <use> через наследование. -->
    <g id="leaf">
      <path d="M0 0 C 18 -21 52 -25 76 0 C 52 25 18 21 0 0 Z"/>
      <path d="M3 0 H 68" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M20 -2 L 32 -13 M20 2 L 32 13 M36 -2 L 48 -13 M36 2 L 48 13 M52 0 L 60 -8 M52 0 L 60 8"
            fill="none" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Крест (латинский, с заострённым низом) -->
    <path id="cross-shape" d="M18 0 H30 V16 H46 V28 H30 V58 L24 68 L18 58 V28 H2 V16 H18 Z"/>
  </defs>
</svg>

<!-- ===== Листья слева ===== -->
<svg class="leaves leaves--left" viewBox="0 0 220 1200" preserveAspectRatio="xMidYMid slice"
     aria-hidden="true" focusable="false">
  <path class="vine" d="M110 0 C 96 200 124 400 110 600 C 96 800 124 1000 110 1200"/>

  <use class="leaf leaf--solid" href="#leaf" transform="translate(108 90) rotate(-28) scale(0.92)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 210) rotate(206) scale(0.8)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(104 330) rotate(-18) scale(0.7)"/>
  <use class="leaf"             href="#leaf" transform="translate(114 450) rotate(196) scale(0.9)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(106 570) rotate(-34) scale(0.78)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 690) rotate(212) scale(0.72)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(104 810) rotate(-22) scale(0.9)"/>
  <use class="leaf"             href="#leaf" transform="translate(114 930) rotate(200) scale(0.8)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(106 1050) rotate(-30) scale(0.72)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 1170) rotate(208) scale(0.88)"/>

  <use class="leaf leaf--solid" href="#leaf" transform="translate(110 150) rotate(24) scale(0.48)"/>
  <use class="leaf"             href="#leaf" transform="translate(110 390) rotate(168) scale(0.46)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(110 630) rotate(20) scale(0.5)"/>
  <use class="leaf"             href="#leaf" transform="translate(110 870) rotate(172) scale(0.46)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(110 1110) rotate(26) scale(0.5)"/>
</svg>

<!-- ===== Центр: череп + вращающиеся кресты ===== -->
<main class="stage">
  <div class="ring" aria-hidden="true" focusable="false">
    <span class="slot" style="--a:0deg">
      <span class="unspin"><svg class="cross" viewBox="0 0 48 68"><use href="#cross-shape"/></svg></span>
    </span>
    <span class="slot" style="--a:60deg">
      <span class="unspin"><svg class="cross" viewBox="0 0 48 68"><use href="#cross-shape"/></svg></span>
    </span>
    <span class="slot" style="--a:120deg">
      <span class="unspin"><svg class="cross" viewBox="0 0 48 68"><use href="#cross-shape"/></svg></span>
    </span>
    <span class="slot" style="--a:180deg">
      <span class="unspin"><svg class="cross" viewBox="0 0 48 68"><use href="#cross-shape"/></svg></span>
    </span>
    <span class="slot" style="--a:240deg">
      <span class="unspin"><svg class="cross" viewBox="0 0 48 68"><use href="#cross-shape"/></svg></span>
    </span>
    <span class="slot" style="--a:300deg">
      <span class="unspin"><svg class="cross" viewBox="0 0 48 68"><use href="#cross-shape"/></svg></span>
    </span>
  </div>

  <!-- Череп -->
  <img class="skull" src="skull.png" alt="Череп с трещинами" width="928" height="1136">
</main>

<!-- ===== Листья справа ===== -->
<svg class="leaves leaves--right" viewBox="0 0 220 1200" preserveAspectRatio="xMidYMid slice"
     aria-hidden="true" focusable="false">
  <path class="vine" d="M110 0 C 96 200 124 400 110 600 C 96 800 124 1000 110 1200"/>

  <use class="leaf leaf--solid" href="#leaf" transform="translate(108 90) rotate(-28) scale(0.92)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 210) rotate(206) scale(0.8)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(104 330) rotate(-18) scale(0.7)"/>
  <use class="leaf"             href="#leaf" transform="translate(114 450) rotate(196) scale(0.9)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(106 570) rotate(-34) scale(0.78)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 690) rotate(212) scale(0.72)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(104 810) rotate(-22) scale(0.9)"/>
  <use class="leaf"             href="#leaf" transform="translate(114 930) rotate(200) scale(0.8)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(106 1050) rotate(-30) scale(0.72)"/>
  <use class="leaf"             href="#leaf" transform="translate(112 1170) rotate(208) scale(0.88)"/>

  <use class="leaf leaf--solid" href="#leaf" transform="translate(110 150) rotate(24) scale(0.48)"/>
  <use class="leaf"             href="#leaf" transform="translate(110 390) rotate(168) scale(0.46)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(110 630) rotate(20) scale(0.5)"/>
  <use class="leaf"             href="#leaf" transform="translate(110 870) rotate(172) scale(0.46)"/>
  <use class="leaf leaf--solid" href="#leaf" transform="translate(110 1110) rotate(26) scale(0.5)"/>
</svg>

<!-- ============================================================
     ЗДЕСЬ ПОЗЖЕ БУДЕТ КОНТЕНТ САЙТА (имя, услуги, контакты)
     ============================================================ -->

</body>
</html>
